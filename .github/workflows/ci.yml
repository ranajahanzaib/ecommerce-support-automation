name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' -e '../commerce-simulator[dev]'
        working-directory: apps/api
      - run: ruff check commerceaction tests
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api
      - run: PYTHONPATH=.:../api python -m pytest
        working-directory: apps/commerce-simulator
      - run: PYTHONPATH=.:../api python -m ruff check commerce_simulator tests
        working-directory: apps/commerce-simulator
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck && pnpm build
        working-directory: apps/web
